services:
  fitcheck:
    build: .
    image: fitcheck:latest
    container_name: fitcheck
    # This NAS has ~1.2GB spare and an earlyoom that has killed Jellyfin before,
    # so nothing here is allowed to grow without a ceiling. Measured idle: 66MB;
    # 256m leaves room for a photo-heavy sync without letting a leak take the box
    # down. The cap lived only on the NAS's copy of this file, so a deploy from
    # the repo silently removed it — it belongs in version control.
    mem_limit: 256m
    restart: unless-stopped
    ports:
      # Nginx Proxy Manager runs in its own container, so it cannot reach
      # 127.0.0.1 on the host. Publishing on the LAN is the simple, always-works
      # option; point NPM at http://<nas-ip>:3210. To keep it off the LAN
      # entirely, drop this block, join NPM's docker network below, and point
      # NPM at http://fitcheck:3000 instead.
      - '3210:3000'
    environment:
      FITCHECK_DATA_DIR: /data
      # Signs the session cookies. Changing it signs everybody out.
      FITCHECK_SECRET: ${FITCHECK_SECRET:?set FITCHECK_SECRET in .env}
      # name:salt:hash entries separated by ; — see npm run add-user
      FITCHECK_USERS: ${FITCHECK_USERS:?set FITCHECK_USERS in .env}
      # Daily reminders. Without these the app runs fine and the reminder
      # setting says plainly that it is not configured.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:fitcheck@localhost}
    volumes:
      # The wardrobes. Back this folder up and nothing else matters.
      - ./data:/data
    healthcheck:
      # Answering HTTP is not the same as working. The wardrobe sync writes into
      # /data, and a bind mount keeps the HOST's ownership: when that folder was
      # owned by another uid the app could read but never write, so every
      # /api/sync/push returned 500 and nobody's closet was being backed up --
      # while this healthcheck stayed green the whole time, because the HTTP
      # endpoint was fine. So probe the write too; that is the failure that
      # actually loses data.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/auth/me >/dev/null 2>&1 && touch /data/.healthcheck && rm -f /data/.healthcheck',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# Uncomment together with the note above to keep the app off the LAN.
# networks:
#   default:
#     name: ${NPM_NETWORK:-npm_default}
#     external: true
