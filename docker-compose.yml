services:
  fitcheck:
    build: .
    image: fitcheck:latest
    container_name: fitcheck
    restart: unless-stopped
    ports:
      # Nginx Proxy Manager runs in its own container, so it cannot reach
      # 127.0.0.1 on the host. Publishing on the LAN is the simple, always-works
      # option; point NPM at http://<nas-ip>:3210. To keep it off the LAN
      # entirely, drop this block, join NPM's docker network below, and point
      # NPM at http://fitcheck:3000 instead.
      - '3210:3000'
    environment:
      FITCHECK_DATA_DIR: /data
      # Signs the session cookies. Changing it signs everybody out.
      FITCHECK_SECRET: ${FITCHECK_SECRET:?set FITCHECK_SECRET in .env}
      # name:salt:hash entries separated by ; — see npm run add-user
      FITCHECK_USERS: ${FITCHECK_USERS:?set FITCHECK_USERS in .env}
      # Daily reminders. Without these the app runs fine and the reminder
      # setting says plainly that it is not configured.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:fitcheck@localhost}
    volumes:
      # The wardrobes. Back this folder up and nothing else matters.
      - ./data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/auth/me']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# Uncomment together with the note above to keep the app off the LAN.
# networks:
#   default:
#     name: ${NPM_NETWORK:-npm_default}
#     external: true
