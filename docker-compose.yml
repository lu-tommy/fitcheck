services:
  outfitai:
    build: .
    container_name: outfitai
    restart: unless-stopped
    # Only nginx needs to reach it; nothing is exposed to the LAN directly.
    ports:
      - '127.0.0.1:3210:3000'
    environment:
      OUTFITAI_DATA_DIR: /data
      # Sessions are signed with this. Changing it signs everybody out.
      OUTFITAI_SECRET: ${OUTFITAI_SECRET:?set OUTFITAI_SECRET in .env}
      # name:salt:hash entries separated by ; — see npm run add-user
      OUTFITAI_USERS: ${OUTFITAI_USERS:?set OUTFITAI_USERS in .env}
    volumes:
      # The wardrobes. Back this folder up and nothing else matters.
      - ./data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/auth/me']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
