# fitcheck.tommyluhome.duckdns.org
#
# The app listens on 127.0.0.1:3210 and is never exposed to the LAN directly,
# so nginx is the only way in and TLS terminates here.

server {
    listen 80;
    listen [::]:80;
    server_name fitcheck.tommyluhome.duckdns.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitcheck.tommyluhome.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/fitcheck.tommyluhome.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitcheck.tommyluhome.duckdns.org/privkey.pem;

    # A wardrobe is private. Keep it out of search results and out of referrers.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Photos, not documents: importing a whole wardrobe is tens of megabytes.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The login rate limiter reads this. Without it every attempt looks as
        # though it came from the same place.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
